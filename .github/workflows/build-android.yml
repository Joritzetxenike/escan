name: Build Android APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Subir versión en app.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$VERSION';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:master

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npm test

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Construir APK con EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > /tmp/build.json

      - name: Descargar APK
        run: |
          APK_URL=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/build.json')); console.log(d[0].artifacts.buildUrl)")
          curl -L "$APK_URL" -o "escan-${{ github.ref_name }}.apk"

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "escan-${{ github.ref_name }}.apk" \
            --title "Escan ${{ github.ref_name }}" \
            --generate-notes