name: Build Android APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Subir versión en app.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$VERSION';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:master

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npm test

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Construir APK con EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > /tmp/build.json

      - name: Descargar APK
        run: |
          APK_URL=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/build.json')); console.log(d[0].artifacts.buildUrl)")
          curl -L "$APK_URL" -o "InventoryScanner-${{ github.ref_name }}.apk"

      # El build ocurre en la nube de EAS, donde `.env` no llega
      # (está en `.gitignore`). Si las variables de Supabase no
      # están en `eas.json`, el bundle sale sin credenciales y la
      # app se queda en pantalla blanca en el móvil: sin logs y
      # sin caja de error, porque el fallo era en tiempo de
      # import. Pasó en la 1.0.5.
      #
      # Por eso se abre el APK ya construido y se busca el host de
      # Supabase dentro del bundle: si no está, el fallo se ve
      # aquí y no cuando alguien instala el APK.
      - name: Verificar bundle del APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          APK="InventoryScanner-${{ github.ref_name }}.apk"

          rm -rf /tmp/apkcheck
          mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" "assets/index.android.bundle" -d /tmp/apkcheck

          BUNDLE=/tmp/apkcheck/assets/index.android.bundle
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::No se encontró assets/index.android.bundle en el APK"
            exit 1
          fi

          HOST="${EXPO_PUBLIC_SUPABASE_URL#https://}"
          HOST="${HOST%%/*}"

          if [ -z "$HOST" ]; then
            HOST="supabase.co"
          fi

          if grep -qa "$HOST" "$BUNDLE"; then
            echo "OK: el bundle incluye la configuración de Supabase ($HOST)"
          else
            echo "::error::El bundle NO incluye la configuración de Supabase ($HOST)."
            echo "::error::Este APK arrancaría en pantalla blanca. Revisa eas.json"
            echo "::error::(build.preview.env) o las variables EXPO_PUBLIC_SUPABASE_*."
            exit 1
          fi

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "InventoryScanner-${{ github.ref_name }}.apk" \
            --title "InventoryScanner ${{ github.ref_name }}" \
            --generate-notes