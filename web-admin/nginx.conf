# Panel de inventario: web estática (SPA) que habla directamente
# con Supabase desde el navegador. nginx solo sirve los ficheros.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los ficheros de assets llevan hash en el nombre: se pueden
    # cachear mucho tiempo sin riesgo de ver una versión vieja.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché: así, al reconstruir el
    # contenedor, todos ven la versión nueva al recargar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
